services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sewasetu}
      POSTGRES_USER: ${POSTGRES_USER:-sewasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sewasetu123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sewasetu} -d ${POSTGRES_DB:-sewasetu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sewasetu}
      POSTGRES_USER: ${POSTGRES_USER:-sewasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sewasetu123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      SECRET_KEY: ${SECRET_KEY:-}
      # The public URL where this portal is reachable (required for OAuth 2.1 RFC 8414 discovery and JWT tokens)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_started
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    restart: unless-stopped
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sewasetu}
      POSTGRES_USER: ${POSTGRES_USER:-sewasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sewasetu123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    restart: unless-stopped
    # Internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:

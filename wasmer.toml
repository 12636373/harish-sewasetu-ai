[package]
name = "harish-sewasetu-ai"
version = "1.0.0"
description = "SewaSetu AI — Autonomous Agentic Public Welfare & Pension Platform by Harish"
license = "MIT"

[dependencies]
"wasmer/python" = ">=3.12"

[fs]
"/app" = "app"
"/main.py" = "main.py"
"/wsgi.py" = "wsgi.py"
"/requirements.txt" = "requirements.txt"

[[command]]
name = "script"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/main.py"
]
env = [
    "PYTHONEXECUTABLE=/bin/python",
    "PYTHONPATH=/app:.",
    "PORT=8080"
]

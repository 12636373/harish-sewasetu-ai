[package]
name = "sewasetu-assistant"
version = "1.0.0"
description = "Sewa Setu — Old Age Pension Scheme Portal & Agent-Ready MCP Server"
license = "MIT"

[dependencies]
"python/python" = "^3.11"

[fs]
"/app" = "app"

[[command]]
name = "server"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-m", "gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "app:app"]

[package]
name = "sewasetu-assistant"
version = "1.0.0"
description = "Sewa Setu — Old Age Pension Scheme Portal & Agent-Ready MCP Server"
license = "MIT"

[dependencies]
"wasmer/python" = ">=3.12"

[fs]
"/app" = "app"
"/main.py" = "main.py"
"/wsgi.py" = "wsgi.py"
"/requirements.txt" = "requirements.txt"

[[command]]
name = "script"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/main.py"
]
env = [
    "PYTHONEXECUTABLE=/bin/python",
    "PYTHONPATH=/app:.",
    "PORT=8080"
]
